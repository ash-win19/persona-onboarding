services:
  - type: web
    name: persona-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1-mini
      - key: APP_ORIGINS
        value: https://usepersona.vercel.app
