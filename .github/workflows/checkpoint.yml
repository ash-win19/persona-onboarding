name: Checkpoint checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: persona
          POSTGRES_PASSWORD: persona
          POSTGRES_DB: persona_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U persona -d persona_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run test:e2e && npm run build
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://persona:persona@localhost:5432/persona_test
      - run: npm test && npm run lint && npm run build && npm run typecheck
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:3001
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
